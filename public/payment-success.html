<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: rgba(255, 255, 255, 0.96);
        --text: #14213d;
        --muted: #5b6478;
        --accent: #ff7a32;
        --accent-2: #ffb36b;
        --shadow: 0 24px 70px rgba(20, 33, 61, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top right, rgba(255, 122, 50, 0.14), transparent 30%),
          radial-gradient(circle at bottom left, rgba(255, 179, 107, 0.18), transparent 35%),
          linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        color: var(--text);
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 122, 50, 0.12);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 40px 32px;
        text-align: center;
      }
      .badge {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
        font-size: 42px;
        box-shadow: 0 14px 30px rgba(255, 122, 50, 0.28);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #fff;
        box-shadow: 0 14px 30px rgba(255, 122, 50, 0.22);
      }
      .btn.secondary {
        background: #fff5ee;
        color: var(--accent);
        border: 1px solid rgba(255, 122, 50, 0.2);
      }
      .hint {
        margin-top: 18px;
        font-size: 13px;
        color: #7a8499;
      }
      @media (max-width: 480px) {
        .card { padding: 30px 20px; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">✓</div>
      <h1>Payment Successful</h1>
      <p>Your transaction was verified successfully. You can safely return to the application now.</p>
      <div class="hint">If you were redirected here after payment, your booking or subscription will be updated automatically.</div>
    </main>
  </body>
</html>
