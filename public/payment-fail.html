<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed</title>
    <style>
      :root {
        --bg: #fff8f6;
        --card: rgba(255, 255, 255, 0.98);
        --text: #1f2430;
        --muted: #667085;
        --danger: #e64646;
        --danger-2: #ff8a7a;
        --shadow: 0 24px 70px rgba(230, 70, 70, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(230, 70, 70, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(255, 138, 122, 0.16), transparent 34%),
          linear-gradient(180deg, #fffdfc 0%, var(--bg) 100%);
        color: var(--text);
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid rgba(230, 70, 70, 0.12);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 40px 32px;
        text-align: center;
      }
      .badge {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--danger) 0%, var(--danger-2) 100%);
        color: white;
        font-size: 42px;
        box-shadow: 0 14px 30px rgba(230, 70, 70, 0.22);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn.primary {
        background: linear-gradient(135deg, var(--danger) 0%, var(--danger-2) 100%);
        color: #fff;
        box-shadow: 0 14px 30px rgba(230, 70, 70, 0.18);
      }
      .btn.secondary {
        background: #fff3f2;
        color: var(--danger);
        border: 1px solid rgba(230, 70, 70, 0.2);
      }
      .hint {
        margin-top: 18px;
        font-size: 13px;
        color: #7a8499;
      }
      @media (max-width: 480px) {
        .card { padding: 30px 20px; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">!</div>
      <h1>Payment Failed</h1>
      <p>We could not verify the transaction. No successful charge was confirmed.</p>
      <div class="hint">Please try again or contact support if the issue continues.</div>
    </main>
  </body>
</html>
